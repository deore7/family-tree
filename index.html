<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Family Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="logo">🌳</span>
      <span class="title">Family Tree</span>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Search by name…" autocomplete="off">
      <button id="searchBtn" class="btn" title="Search">🔍</button>
      <div id="searchSuggest" class="search-suggest"></div>
    </div>

    <div class="tools">
      <button id="btnZoomOut" class="btn icon" title="Zoom out">−</button>
      <button id="btnZoomIn" class="btn icon" title="Zoom in">＋</button>
      <button id="btnFit" class="btn icon" title="Fit to screen">⤢</button>
      <button id="btnTable" class="btn" title="People table">📋 Table</button>
      <button id="btnAdd" class="btn" title="Add person" style="display:none">＋ Add</button>
      <button id="btnToken" class="btn" title="GitHub token" style="display:none">🔑</button>
      <button id="btnSave" class="btn" title="Save to GitHub" style="display:none">Save to GitHub</button>
      <button id="btnEdit" class="btn primary" title="Edit">Edit</button>
    </div>
  </header>

  <div id="analyticsBar" class="analytics-bar"></div>

  <main>
    <div id="treeContainer" class="tree-container"></div>
    <aside id="detailPanel" class="detail-panel"></aside>
  </main>

  <!-- People table (filterable) -->
  <div id="peopleTableOverlay" class="table-overlay"></div>

  <!-- Add/Edit person modal -->
  <div id="editorModal" class="modal">
    <form id="editorForm" class="modal-card editor" autocomplete="off"></form>
  </div>

  <!-- Dynamic dialogs (password / token) mount here -->
  <div id="modalRoot"></div>

  <div id="toast" class="toast"></div>

  <!-- D3 for tree layout (vendored locally — no CDN needed) -->
  <script src="js/vendor/d3.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/github.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/location.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/person.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/table.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
