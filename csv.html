<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Family Tree — CSV preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Small additions specific to the CSV preview page. */
    .csvbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .csvbar .status { font-size: 13px; color: var(--muted); }
    .csvbar .status.err { color: #dc2626; }
    .csvbar .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; margin-right: 6px; vertical-align: middle; }
    .csvbar .status.err .dot { background: #dc2626; }
    .csv-drawer { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
      align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .csv-drawer.open { display: flex; }
    .csv-drawer .card { background: var(--card, #fff); color: inherit; border-radius: 12px;
      width: min(760px, 100%); max-height: 90vh; display: flex; flex-direction: column;
      padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .csv-drawer textarea { flex: 1; min-height: 320px; width: 100%; resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      border: 1px solid var(--border, #d1d5db); border-radius: 8px; padding: 10px; }
    .csv-warnings { margin-top: 8px; max-height: 160px; overflow: auto; font-size: 12px; }
    .csv-warnings li { color: #b45309; }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="logo">🌳</span>
      <span class="title">Family Tree <span class="muted" style="font-weight:400">· CSV preview</span></span>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Search by name…" autocomplete="off">
      <button id="searchBtn" class="btn" title="Search">🔍</button>
      <div id="searchSuggest" class="search-suggest"></div>
    </div>

    <div class="tools csvbar">
      <span id="status" class="status"><span class="dot"></span><span id="statusText">Loading…</span></span>
      <button id="btnZoomOut" class="btn icon" title="Zoom out">−</button>
      <button id="btnZoomIn" class="btn icon" title="Zoom in">＋</button>
      <button id="btnFit" class="btn icon" title="Fit to screen">⤢</button>
      <label id="btnLive" class="btn" title="Re-read the CSV file on an interval">
        <input id="liveChk" type="checkbox" style="margin-right:6px" checked>Live
      </label>
      <button id="btnReload" class="btn" title="Re-read the CSV file now">Reload</button>
      <button id="btnPaste" class="btn primary" title="Paste or upload CSV">Edit CSV</button>
    </div>
  </header>

  <main>
    <div id="treeContainer" class="tree-container"></div>
    <aside id="detailPanel" class="detail-panel"></aside>
  </main>

  <!-- Paste / upload CSV -->
  <div id="csvDrawer" class="csv-drawer">
    <div class="card">
      <h2 style="margin-top:0">Edit CSV</h2>
      <p class="hint">Paste CSV below, or load a file. The tree updates as you type — nothing is
        saved to disk. Columns match <code>data/family_template.csv</code>.</p>
      <input id="csvFile" type="file" accept=".csv,text/csv" style="margin-bottom:8px">
      <textarea id="csvText" spellcheck="false" placeholder="member_id,firstName,lastName,gender,father_id,mother_id,spouse_id,…"></textarea>
      <ul id="csvWarnings" class="csv-warnings"></ul>
      <div class="form-actions" style="margin-top:10px">
        <button id="csvClose" class="btn">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- D3 + the pieces the tree/detail panel need (no GitHub/auth/edit code). -->
  <script src="js/vendor/d3.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/person.js"></script>
  <script src="js/csv-import.js"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    // Where the CSV lives. Override with ?csv=path/to/file.csv
    const params = new URLSearchParams(location.search);
    const CSV_PATH = params.get("csv") || "data/family_template.csv";
    const POLL_MS = 2000;

    let lastText = null;    // last CSV text we rendered (to skip no-op re-renders)
    let pollTimer = null;
    let manualText = null;  // non-null when previewing pasted/uploaded CSV
    let rendered = false;   // false until the first successful render

    function setStatus(msg, isError) {
      $("status").className = "status" + (isError ? " err" : "");
      $("statusText").textContent = msg;
    }

    // Convert CSV text -> store -> tree. Returns the warnings list.
    function renderCsv(text, label) {
      const { data, warnings } = CsvImport.convert(text);
      Store.loadData(data);
      // Preserve the current pan/zoom on refreshes; fit on the very first render.
      Tree.render(rendered);
      rendered = true;
      renderWarnings(warnings);
      const n = Object.keys(data.people).length - 2; // minus the two ancestors
      setStatus((label || "Loaded") + " · " + n + " people" +
        (warnings.length ? " · " + warnings.length + " warning(s)" : ""));
      return warnings;
    }

    function renderWarnings(warnings) {
      const box = $("csvWarnings");
      box.innerHTML = warnings.slice(0, 50)
        .map((w) => "<li>" + esc(w) + "</li>").join("");
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Fetch the CSV from disk and render if it changed since last time.
    async function pollFile(force) {
      if (manualText != null) return; // previewing pasted CSV: ignore the file
      try {
        const res = await fetch(CSV_PATH + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error(CSV_PATH + " (" + res.status + ")");
        const text = await res.text();
        if (!force && text === lastText) return; // unchanged — nothing to do
        lastText = text;
        const stamp = new Date().toLocaleTimeString();
        renderCsv(text, "Updated " + stamp);
      } catch (err) {
        setStatus("Can't read " + err.message + " — serve over http (python -m http.server)", true);
      }
    }

    function startPolling() { if (!pollTimer) pollTimer = setInterval(() => pollFile(false), POLL_MS); }
    function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

    // ---------- Search (name / village), reusing Store + Tree ----------
    function matches(p, q) {
      return Store.nameWithFather(p).toLowerCase().includes(q) ||
        Store.fullName(p).toLowerCase().includes(q) ||
        (p.village || "").toLowerCase().includes(q);
    }
    function doSearch() {
      const q = $("searchInput").value.trim().toLowerCase();
      if (!q) return;
      const m = Store.all().filter((p) => !Store.isDummy(p.id)).find((p) => matches(p, q));
      if (!m) { toast("No match for “" + q + "”.", true); return; }
      goTo(m.id);
    }
    function goTo(id) { hideSuggest(); Tree.focusPerson(id); Person.showDetail(id); }
    function renderSuggest() {
      const box = $("searchSuggest");
      const q = $("searchInput").value.trim().toLowerCase();
      if (!q) { hideSuggest(); return; }
      const results = Store.all().filter((p) => !Store.isDummy(p.id))
        .filter((p) => matches(p, q)).slice(0, 10);
      box.innerHTML = results.length
        ? results.map((p) => '<div class="suggest-opt" data-goto="' + p.id + '">' +
            esc(Store.nameWithFather(p)) +
            (p.village ? ' <span class="muted">· ' + esc(p.village) + "</span>" : "") + "</div>").join("")
        : '<div class="suggest-opt muted">No matches</div>';
      box.classList.add("show");
      box.querySelectorAll("[data-goto]").forEach((el) => {
        el.onclick = () => goTo(el.getAttribute("data-goto"));
      });
    }
    function hideSuggest() { const b = $("searchSuggest"); b.classList.remove("show"); b.innerHTML = ""; }

    // ---------- Toast ----------
    let toastTimer;
    function toast(msg, isError) {
      const el = $("toast");
      el.textContent = msg;
      el.className = "toast show" + (isError ? " error" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (el.className = "toast"), 4000);
    }

    // ---------- Paste / upload drawer ----------
    function openDrawer() {
      $("csvText").value = manualText != null ? manualText : (lastText || "");
      $("csvDrawer").classList.add("open");
      $("csvText").focus();
    }
    function closeDrawer() { $("csvDrawer").classList.remove("open"); }

    function onCsvInput() {
      const text = $("csvText").value;
      manualText = text;                 // switch to manual-preview mode
      $("liveChk").checked = false; stopPolling();
      try { renderCsv(text, "Preview"); }
      catch (err) { setStatus("Parse error: " + err.message, true); }
    }

    function wire() {
      $("btnZoomIn").onclick = () => Tree.zoomIn();
      $("btnZoomOut").onclick = () => Tree.zoomOut();
      $("btnFit").onclick = () => Tree.fit();
      $("btnReload").onclick = () => {
        manualText = null;               // leave manual mode, go back to the file
        $("liveChk").checked = true; startPolling();
        pollFile(true);
      };
      $("liveChk").onchange = (e) => { e.target.checked ? startPolling() : stopPolling(); };
      $("btnPaste").onclick = openDrawer;
      $("csvClose").onclick = closeDrawer;
      $("csvDrawer").addEventListener("click", (e) => { if (e.target === $("csvDrawer")) closeDrawer(); });
      $("csvText").addEventListener("input", onCsvInput);
      $("csvFile").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { $("csvText").value = reader.result; onCsvInput(); };
        reader.readAsText(file);
      });

      $("searchBtn").onclick = doSearch;
      const input = $("searchInput");
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { hideSuggest(); doSearch(); } });
      input.addEventListener("input", renderSuggest);
      input.addEventListener("focus", renderSuggest);
      document.addEventListener("click", (e) => { if (!e.target.closest(".search")) hideSuggest(); });
    }

    async function boot() {
      // The tree + detail panel are view-only here (no edit callbacks).
      Tree.init("#treeContainer", { onSelect: (id) => Person.showDetail(id) });
      Person.init({ canEdit: () => false });
      wire();
      await pollFile(true);
      startPolling();
    }

    window.addEventListener("DOMContentLoaded", boot);
  })();
  </script>
</body>
</html>
